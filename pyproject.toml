[project]
name = "project-eye"
version = "0.1.0"
description = "Local macOS drowsiness alarm for study sessions"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "opencv-python>=4.10",
    "mediapipe>=0.10.21",
    "pygame>=2.5",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["eye*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
